[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supermimic"
version = "0.1.0"
description = "SuperMimic G1 motion tracking with mjlab and MuJoCo-Warp"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "hydra-core==1.3.2",
    "mjlab==1.6.0",
    "mujoco==3.11.0",
    "mujoco-warp==3.11.0",
    "warp-lang==1.14.0+cu12",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "numpy>=2.0,<3",
    "matplotlib>=3.9",
    "pillow>=10.4",
    "huggingface-hub>=0.30,<2",
    "imageio-ffmpeg>=0.6",
    "swanlab>=0.10,<1",
    "python-dotenv>=1,<2",
    "mjviser==0.0.14",
    "viser>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
warp-lang = { url = "https://github.com/NVIDIA/warp/releases/download/v1.14.0/warp_lang-1.14.0%2Bcu12-py3-none-manylinux_2_28_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
